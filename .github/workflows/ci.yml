name: Betamovie CI

# Required GitHub secrets:
# - ENV_FILE
# - VPS_HOST
# - VPS_SSH_KEY
# Optional:
# - VPS_PORT
# - VPS_USER
# - DEPLOY_BRANCH
# - DEPLOY_PATH
# - DEPLOY_PROJECT_NAME

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: betamovie-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: "11.9.0"

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: corepack enable
      - run: corepack prepare pnpm@${PNPM_VERSION} --activate
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit

  build-desktop:
    name: Build Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: audit
    container:
      image: electronuserland/builder:22-wine
      options: --user root
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: apt-get update && apt-get install -y git curl openssh-client
      - run: corepack enable
      - run: corepack prepare pnpm@${PNPM_VERSION} --activate
      - name: Write env file
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "${ENV_FILE:-}" ]; then
            echo "ENV_FILE secret is empty."
            exit 1
          fi
          printf '%s' "$ENV_FILE" > .env
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:desktop:all
      - name: Start SSH agent
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Trust VPS host
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Sync downloads to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          if [ -d downloads ] && [ "$(ls -A downloads)" ]; then
            ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "${VPS_PORT:-22}" "${VPS_USER:-betakiot}@${VPS_HOST}" "mkdir -p '${DEPLOY_PATH:-/home/betamovie}'"
            scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "${VPS_PORT:-22}" -r downloads "${VPS_USER:-betakiot}@${VPS_HOST}:${DEPLOY_PATH:-/home/betamovie}/"
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-desktop
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y openssh-client curl
      - name: Start SSH agent
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Trust VPS host
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Sync repo and deploy
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PROJECT_NAME: ${{ secrets.DEPLOY_PROJECT_NAME }}
        run: |
          set -eu

          if [ -z "${ENV_FILE:-}" ]; then
            echo "ENV_FILE secret is empty."
            exit 1
          fi

          DEPLOY_USER="${VPS_USER:-betakiot}"
          DEPLOY_TARGET="${DEPLOY_USER}@${VPS_HOST}"
          DEPLOY_BRANCH="${DEPLOY_BRANCH:-main}"
          DEPLOY_PATH="${DEPLOY_PATH:-/home/betamovie}"
          DEPLOY_PROJECT_NAME="${DEPLOY_PROJECT_NAME:-betamovie}"

          echo "Syncing monorepo on VPS (${DEPLOY_PATH})...."
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "${VPS_PORT:-22}" "${DEPLOY_TARGET}" \
            "set -eu; cd '${DEPLOY_PATH}'; [ -d .git ] || { echo 'Git repository not found at ${DEPLOY_PATH}'; exit 1; }; [ -f deploy.sh ] || { echo 'deploy.sh not found at ${DEPLOY_PATH}'; exit 1; }; [ -f docker-compose.prod.yml ] || { echo 'docker-compose.prod.yml not found at ${DEPLOY_PATH}'; exit 1; }; if [ ! -w .git ]; then echo 'No write permission on .git, trying sudo chown...'; sudo -n chown -R \$(id -un):\$(id -gn) . || { echo 'Cannot write .git and sudo is unavailable. Run once on VPS: sudo chown -R ${DEPLOY_USER}:${DEPLOY_USER} ${DEPLOY_PATH}'; exit 1; }; fi; git fetch origin '${DEPLOY_BRANCH}'; (git checkout '${DEPLOY_BRANCH}' || git checkout -b '${DEPLOY_BRANCH}' 'origin/${DEPLOY_BRANCH}'); git pull --ff-only origin '${DEPLOY_BRANCH}'; git clean -fd; chmod +x deploy.sh"

          ENV_TMP_LOCAL="$(mktemp /tmp/betamovie_env_local.XXXXXX)"
          trap 'rm -f "$ENV_TMP_LOCAL"' EXIT
          printf '%s' "$ENV_FILE" > "$ENV_TMP_LOCAL"
          chmod 600 "$ENV_TMP_LOCAL"

          echo "Building prod stack from ${DEPLOY_PATH}..."
          printf '%s' "$ENV_FILE" | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "${VPS_PORT:-22}" "${DEPLOY_TARGET}" \
            "set -eu; ENV_TMP=\$(mktemp /tmp/betamovie_env.XXXXXX); trap 'rm -f \"\$ENV_TMP\"' EXIT; cat > \"\$ENV_TMP\"; chmod 600 \"\$ENV_TMP\"; cd '${DEPLOY_PATH}'; SKIP_CLOUDFLARE_PURGE='true' PROJECT_NAME='${DEPLOY_PROJECT_NAME}' COMPOSE_FILE='docker-compose.prod.yml' ENV_FILE_PATH=\"\$ENV_TMP\" ./deploy.sh all"

          echo "Purging Cloudflare cache..."
          ./scripts/purge-cloudflare-cache.sh "$ENV_TMP_LOCAL"
