stages:
  - audit
  - build-app
  - deploy
  - publish-desktop

variables:
  GIT_STRATEGY: none
  PNPM_VERSION: "11.9.0"

# Required CI/CD variables (GitLab > Settings > CI/CD > Variables):
# - VPS_HOST: SSH host of your VPS
# - VPS_SSH_KEY: private SSH key for deployment user
# - ENV_FILE: full monorepo .env file content (frontend + backend, multiline)
# Optional:
# - VPS_PORT: SSH port (default: 22)
# - VPS_USER: SSH user (default: betakiot)
# - DEPLOY_BRANCH: git branch to deploy (default: main)
# - DEPLOY_PATH: monorepo path on VPS (default: /home/betamovie)
# - DEPLOY_PROJECT_NAME: docker compose project name (default: betamovie)
# - FORCE_DESKTOP_PUBLISH: set to "true" to bypass desktop changes filter

.default_ssh_setup: &default_ssh_setup
  before_script:
    - which apk && apk add --no-cache openssh-client git curl tar || (apt-get update && apt-get install -y openssh-client git curl tar && rm -rf /var/lib/apt/lists/*)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval "$(ssh-agent -s)"
    - echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts

audit:betamovie:
  stage: audit
  image: node:22-alpine
  variables:
    GIT_STRATEGY: fetch
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - apk add --no-cache git
    - corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm audit
    - echo "All audits passed for betamovie-fe & betamovie-be."

build:desktop:
  stage: build-app
  image: electronuserland/builder:22-wine
  variables:
    GIT_STRATEGY: fetch
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $FORCE_DESKTOP_PUBLISH == "true"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - betamovie-fe/**/*
        - betamovie-desktop/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
  script:
    - |
      set -eu

      if [ -z "${ENV_FILE:-}" ]; then
        echo "ENV_FILE is empty. Please set ENV_FILE in GitLab CI/CD variables."
        exit 1
      fi

      corepack enable
      corepack prepare pnpm@${PNPM_VERSION} --activate

      printf '%s' "$ENV_FILE" > .env
      printf '%s' "$ENV_FILE" > betamovie-fe/.env

      BACKEND_URL="$(grep -E '^VITE_BACKEND_URL=' .env | head -n 1 | cut -d= -f2- | tr -d '"' | tr -d "'" || true)"
      if [ -n "$BACKEND_URL" ]; then
        export VITE_BACKEND_URL="$BACKEND_URL"
      fi

      DEVTOOLS="$(grep -E '^VITE_ENABLE_DEVTOOLS_PROTECTION=' .env | head -n 1 | cut -d= -f2- | tr -d '"' | tr -d "'" || true)"
      if [ -n "$DEVTOOLS" ]; then
        export VITE_ENABLE_DEVTOOLS_PROTECTION="$DEVTOOLS"
      fi

      pnpm install --frozen-lockfile

      ARTIFACT_ROOT="desktop-artifacts"
      RELEASE_DIR="betamovie-desktop/release"

      clean_release_dir() {
        rm -rf "$RELEASE_DIR"
        mkdir -p "$RELEASE_DIR"
      }

      require_files() {
        variant="$1"
        shift
        target="$ARTIFACT_ROOT/$variant"
        mkdir -p "$target"

        for pattern in "$@"; do
          found=false
          for file in $RELEASE_DIR/$pattern; do
            if [ ! -e "$file" ]; then
              continue
            fi

            cp "$file" "$target/"
            found=true
          done

          if [ "$found" = false ]; then
            echo "Missing required desktop artifact for ${variant}: ${pattern}"
            exit 1
          fi
        done
      }

      copy_optional() {
        variant="$1"
        pattern="$2"
        target="$ARTIFACT_ROOT/$variant"
        mkdir -p "$target"

        for file in $RELEASE_DIR/$pattern; do
          if [ -e "$file" ]; then
            cp "$file" "$target/"
          fi
        done
      }

      rm -rf "$ARTIFACT_ROOT"

      pnpm --filter betamovie-desktop build

      clean_release_dir
      pnpm --filter betamovie-desktop exec electron-builder --mac zip --arm64
      require_files "mac-arm64" "latest-mac.yml" "AlphaFlix-*-arm64-mac.zip" "AlphaFlix-*-arm64-mac.zip.blockmap"
      copy_optional "mac-arm64" "AlphaFlix-*-arm64-mac.dmg"

      clean_release_dir
      pnpm --filter betamovie-desktop exec electron-builder --mac zip --x64
      require_files "mac-x64" "latest-mac.yml" "AlphaFlix-*-x64-mac.zip" "AlphaFlix-*-x64-mac.zip.blockmap"
      copy_optional "mac-x64" "AlphaFlix-*-x64-mac.dmg"

      clean_release_dir
      pnpm --filter betamovie-desktop exec electron-builder --win nsis --x64
      require_files "win-x64" "latest.yml" "AlphaFlix-*-x64.exe" "AlphaFlix-*-x64.exe.blockmap"

      clean_release_dir
      pnpm --filter betamovie-desktop exec electron-builder --win nsis --arm64
      require_files "win-arm64" "latest.yml" "AlphaFlix-*-arm64.exe" "AlphaFlix-*-arm64.exe.blockmap"

      find "$ARTIFACT_ROOT" -maxdepth 2 -type f | sort
  artifacts:
    paths:
      - desktop-artifacts/
    expire_in: 1 day

deploy:betamovie:
  stage: deploy
  image: alpine:3.19
  timeout: 30m
  extends: [.default_ssh_setup]
  variables:
    GIT_STRATEGY: fetch
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - |
      set -eu

      if [ -z "${ENV_FILE:-}" ]; then
        echo "ENV_FILE is empty. Please set ENV_FILE in GitLab CI/CD variables."
        exit 1
      fi

      DEPLOY_USER="${VPS_USER:-betakiot}"
      DEPLOY_TARGET="${DEPLOY_USER}@${VPS_HOST}"
      DEPLOY_BRANCH="${DEPLOY_BRANCH:-main}"
      DEPLOY_PATH="${DEPLOY_PATH:-/home/betamovie}"
      DEPLOY_PROJECT_NAME="${DEPLOY_PROJECT_NAME:-betamovie}"

      echo "Syncing monorepo on VPS (${DEPLOY_PATH})..."
      ssh -p "${VPS_PORT:-22}" "${DEPLOY_TARGET}" \
        "set -eu; cd '${DEPLOY_PATH}'; [ -d .git ] || { echo 'Git repository not found at ${DEPLOY_PATH}'; exit 1; }; if [ ! -w .git ]; then echo 'No write permission on .git, trying sudo chown...'; sudo -n chown -R \$(id -un):\$(id -gn) . || { echo 'Cannot write .git and sudo is unavailable. Run once on VPS: sudo chown -R ${DEPLOY_USER}:${DEPLOY_USER} ${DEPLOY_PATH}'; exit 1; }; fi; CURRENT_URL=\$(git remote get-url origin 2>/dev/null || echo ''); case \"\$CURRENT_URL\" in https://github.com/*) echo 'Converting HTTPS origin to SSH...'; NEW_URL=\$(echo \"\$CURRENT_URL\" | sed 's|^https://github.com/|git@github.com:|'); git remote set-url origin \"\$NEW_URL\"; ;; esac; git fetch origin '${DEPLOY_BRANCH}'; (git checkout '${DEPLOY_BRANCH}' || git checkout -b '${DEPLOY_BRANCH}' 'origin/${DEPLOY_BRANCH}'); git pull --ff-only origin '${DEPLOY_BRANCH}'; git clean -fd; [ -f scripts/deploy.sh ] || { echo 'scripts/deploy.sh not found at ${DEPLOY_PATH}'; exit 1; }; [ -f docker-compose.prod.yml ] || { echo 'docker-compose.prod.yml not found at ${DEPLOY_PATH}'; exit 1; }; chmod +x scripts/deploy.sh"



      echo "Building prod stack from ${DEPLOY_PATH}..."
      printf '%s' "$ENV_FILE" | ssh -p "${VPS_PORT:-22}" "${DEPLOY_TARGET}" \
        "set -eu; ENV_TMP=\$(mktemp /tmp/${CI_PROJECT_NAME}_env.XXXXXX); trap 'rm -f \"\$ENV_TMP\"' EXIT; cat > \"\$ENV_TMP\"; chmod 600 \"\$ENV_TMP\"; cd '${DEPLOY_PATH}'; SKIP_CLOUDFLARE_PURGE='true' PROJECT_NAME='${DEPLOY_PROJECT_NAME}' COMPOSE_FILE='docker-compose.prod.yml' ENV_FILE_PATH=\"\$ENV_TMP\" ./scripts/deploy.sh all"

      echo "Purging Cloudflare cache..."
      ENV_TMP_LOCAL="$(mktemp /tmp/${CI_PROJECT_NAME}_env_local.XXXXXX)"
      trap 'rm -f "$ENV_TMP_LOCAL"' EXIT
      printf '%s' "$ENV_FILE" > "$ENV_TMP_LOCAL"
      chmod 600 "$ENV_TMP_LOCAL"
      ./scripts/purge-cloudflare-cache.sh "$ENV_TMP_LOCAL"

publish:desktop:
  stage: publish-desktop
  image: node:22-alpine
  timeout: 45m
  extends: [.default_ssh_setup]
  variables:
    GIT_STRATEGY: fetch
  needs:
    - job: deploy:betamovie
    - job: build:desktop
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $FORCE_DESKTOP_PUBLISH == "true"'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - betamovie-fe/**/*
        - betamovie-desktop/**/*
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
  script:
    - |
      set -eu

      if [ -z "${ENV_FILE:-}" ]; then
        echo "ENV_FILE is empty. Please set ENV_FILE in GitLab CI/CD variables."
        exit 1
      fi

      if [ ! -d "desktop-artifacts" ]; then
        echo "desktop-artifacts is missing. Ensure build:desktop completed successfully."
        exit 1
      fi

      PUBLISHED_AT="${CI_PIPELINE_CREATED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"

      node scripts/create-desktop-release-bundle.js \
        --input-root desktop-artifacts \
        --output-dir desktop-release-bundle \
        --channel stable \
        --published-at "$PUBLISHED_AT"

      node scripts/verify-desktop-release-bundle.js desktop-release-bundle
      tar -czf desktop-release-bundle.tar.gz -C desktop-release-bundle .

      DEPLOY_USER="${VPS_USER:-betakiot}"
      DEPLOY_TARGET="${DEPLOY_USER}@${VPS_HOST}"
      DEPLOY_PATH="${DEPLOY_PATH:-/home/betamovie}"
      DEPLOY_PROJECT_NAME="${DEPLOY_PROJECT_NAME:-betamovie}"
      STAGING_PATH="${DEPLOY_PATH}/desktop-publish-staging"

      ssh -p "${VPS_PORT:-22}" "${DEPLOY_TARGET}" "mkdir -p '${STAGING_PATH}'"
      scp -P "${VPS_PORT:-22}" desktop-release-bundle.tar.gz "${DEPLOY_TARGET}:${STAGING_PATH}/desktop-release-bundle.tar.gz"

      printf '%s' "$ENV_FILE" | ssh -p "${VPS_PORT:-22}" "${DEPLOY_TARGET}" \
        "set -eu; ENV_TMP=\$(mktemp /tmp/${CI_PROJECT_NAME}_env.XXXXXX); trap 'rm -f \"\$ENV_TMP\"' EXIT; cat > \"\$ENV_TMP\"; chmod 600 \"\$ENV_TMP\"; cd '${DEPLOY_PATH}'; PROJECT_NAME='${DEPLOY_PROJECT_NAME}' COMPOSE_FILE='docker-compose.prod.yml' ENV_FILE_PATH=\"\$ENV_TMP\" ./scripts/deploy.sh publish-desktop"
