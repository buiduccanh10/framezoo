stages:
  - audit
  - build-app
  - deploy

variables:
  GIT_STRATEGY: none
  PNPM_VERSION: "11.9.0"

# Required CI/CD variables (GitLab > Settings > CI/CD > Variables):
# - VPS_HOST: SSH host of your VPS
# - VPS_SSH_KEY: private SSH key for deployment user
# - ENV_FILE: full monorepo .env file content (frontend + backend, multiline)
# Optional:
# - VPS_PORT: SSH port (default: 22)
# - VPS_USER: SSH user (default: betakiot)
# - DEPLOY_BRANCH: git branch to deploy (default: main)
# - DEPLOY_PATH: monorepo path on VPS (default: /home/betamovie)

.default_ssh_setup: &default_ssh_setup
  before_script:
    - which apk && apk add --no-cache openssh-client git curl || (apt-get update && apt-get install -y openssh-client git curl && rm -rf /var/lib/apt/lists/*)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval "$(ssh-agent -s)"
    - echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts

audit:betamovie:
  stage: audit
  image: node:22-alpine
  variables:
    GIT_STRATEGY: fetch
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - apk add --no-cache git
    - corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm audit
    - echo "All audits passed for betamovie-fe & betamovie-be."

build:desktop:
  stage: build-app
  image: electronuserland/builder:22-wine
  extends: [.default_ssh_setup]
  variables:
    GIT_STRATEGY: fetch
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - betamovie-fe/**/*
        - betamovie-desktop/package.json
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
  script:
    - corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate
    # Create the env file from GitLab CI/CD variables so build uses prod configs
    - echo "$ENV_FILE" > .env
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm build:desktop:all
    # Sync downloads folder directly to VPS to avoid 413 payload limit in GitLab artifacts
    - |
      if [ -d "downloads" ] && [ "$(ls -A downloads)" ]; then
        echo "Syncing downloads folder directly to VPS (${DEPLOY_PATH:-/home/betamovie})..."
        ssh -p "${VPS_PORT:-22}" "${VPS_USER:-betakiot}@${VPS_HOST}" "mkdir -p '${DEPLOY_PATH:-/home/betamovie}'"
        scp -P "${VPS_PORT:-22}" -r downloads "${VPS_USER:-betakiot}@${VPS_HOST}:${DEPLOY_PATH:-/home/betamovie}/"
      fi

deploy:betamovie:
  stage: deploy
  image: alpine:3.19
  timeout: 30m
  extends: [.default_ssh_setup]
  variables:
    GIT_STRATEGY: fetch
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - |
      set -eu

      if [ -z "${ENV_FILE:-}" ]; then
        echo "ENV_FILE is empty. Please set ENV_FILE in GitLab CI/CD variables."
        exit 1
      fi

      DEPLOY_USER="${VPS_USER:-betakiot}"
      DEPLOY_TARGET="${DEPLOY_USER}@${VPS_HOST}"
      DEPLOY_BRANCH="${DEPLOY_BRANCH:-main}"
      DEPLOY_PATH="${DEPLOY_PATH:-/home/betamovie}"
      DEPLOY_PROJECT_NAME="${DEPLOY_PROJECT_NAME:-betamovie}"

      echo "Syncing monorepo on VPS (${DEPLOY_PATH})..."
      ssh -p "${VPS_PORT:-22}" "${DEPLOY_TARGET}" \
        "set -eu; cd '${DEPLOY_PATH}'; [ -d .git ] || { echo 'Git repository not found at ${DEPLOY_PATH}'; exit 1; }; [ -f betamovie-be/scripts/deploy.sh ] || { echo 'betamovie-be/scripts/deploy.sh not found at ${DEPLOY_PATH}'; exit 1; }; [ -f docker-compose.prod.yml ] || { echo 'docker-compose.prod.yml not found at ${DEPLOY_PATH}'; exit 1; }; if [ ! -w .git ]; then echo 'No write permission on .git, trying sudo chown...'; sudo -n chown -R \$(id -un):\$(id -gn) . || { echo 'Cannot write .git and sudo is unavailable. Run once on VPS: sudo chown -R ${DEPLOY_USER}:${DEPLOY_USER} ${DEPLOY_PATH}'; exit 1; }; fi; git fetch origin '${DEPLOY_BRANCH}'; (git checkout '${DEPLOY_BRANCH}' || git checkout -b '${DEPLOY_BRANCH}' 'origin/${DEPLOY_BRANCH}'); git pull --ff-only origin '${DEPLOY_BRANCH}'; git clean -fd; chmod +x betamovie-be/scripts/deploy.sh"



      echo "Building prod stack from ${DEPLOY_PATH}..."
      printf '%s' "$ENV_FILE" | ssh -p "${VPS_PORT:-22}" "${DEPLOY_TARGET}" \
        "set -eu; ENV_TMP=\$(mktemp /tmp/${CI_PROJECT_NAME}_env.XXXXXX); trap 'rm -f \"\$ENV_TMP\"' EXIT; cat > \"\$ENV_TMP\"; chmod 600 \"\$ENV_TMP\"; cd '${DEPLOY_PATH}'; SKIP_CLOUDFLARE_PURGE='true' PROJECT_NAME='${DEPLOY_PROJECT_NAME}' COMPOSE_FILE='docker-compose.prod.yml' ENV_FILE_PATH=\"\$ENV_TMP\" ./betamovie-be/scripts/deploy.sh all"

      echo "Purging Cloudflare cache..."
      ENV_TMP_LOCAL="$(mktemp /tmp/${CI_PROJECT_NAME}_env_local.XXXXXX)"
      trap 'rm -f "$ENV_TMP_LOCAL"' EXIT
      printf '%s' "$ENV_FILE" > "$ENV_TMP_LOCAL"
      chmod 600 "$ENV_TMP_LOCAL"
      ./scripts/purge-cloudflare-cache.sh "$ENV_TMP_LOCAL"
