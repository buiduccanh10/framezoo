stages:
  - audit
  - deploy

variables:
  GIT_STRATEGY: none
  PNPM_VERSION: "11.9.0"

# Required CI/CD variables (GitLab > Settings > CI/CD > Variables):
# - VPS_HOST: SSH host of your VPS
# - VPS_SSH_KEY: private SSH key for deployment user
# - ENV_FILE: full monorepo .env file content (frontend + backend, multiline)
# Optional:
# - VPS_PORT: SSH port (default: 22)
# - VPS_USER: SSH user (default: betakiot)
# - DEPLOY_BRANCH: git branch to deploy (default: main)
# - DEPLOY_PATH: monorepo path on VPS (default: /home/framezoo)
# - DEPLOY_PROJECT_NAME: docker compose project name (default: framezoo)
.default_ssh_setup: &default_ssh_setup
  before_script:
    - which apk && apk add --no-cache openssh-client git curl tar || (apt-get update && apt-get install -y openssh-client git curl tar && rm -rf /var/lib/apt/lists/*)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval "$(ssh-agent -s)"
    - echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts

audit:framezoo:
  stage: audit
  image: node:22-alpine
  variables:
    GIT_STRATEGY: fetch
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - apk add --no-cache git
    - corepack enable && corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm audit
    - echo "All audits passed for framezoo-fe & framezoo-be."

deploy:framezoo:
  stage: deploy
  image: alpine:3.19
  timeout: 30m
  extends: [.default_ssh_setup]
  needs:
    - job: audit:framezoo
  variables:
    GIT_STRATEGY: fetch
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - |
      set -eu

      if [ -z "${ENV_FILE:-}" ]; then
        echo "ENV_FILE is empty. Please set ENV_FILE in GitLab CI/CD variables."
        exit 1
      fi

      DEPLOY_USER="${VPS_USER:-betakiot}"
      DEPLOY_TARGET="${DEPLOY_USER}@${VPS_HOST}"
      DEPLOY_BRANCH="${DEPLOY_BRANCH:-main}"
      DEPLOY_PATH="${DEPLOY_PATH:-/home/framezoo}"
      DEPLOY_PROJECT_NAME="${DEPLOY_PROJECT_NAME:-framezoo}"

      echo "Syncing monorepo on VPS (${DEPLOY_PATH})..."
      ssh -p "${VPS_PORT:-22}" "${DEPLOY_TARGET}" \
        "set -eu; cd '${DEPLOY_PATH}'; [ -d .git ] || { echo 'Git repository not found at ${DEPLOY_PATH}'; exit 1; }; if [ ! -w .git ]; then echo 'No write permission on .git, trying sudo chown...'; sudo -n chown -R \$(id -un):\$(id -gn) . || { echo 'Cannot write .git and sudo is unavailable. Run once on VPS: sudo chown -R ${DEPLOY_USER}:${DEPLOY_USER} ${DEPLOY_PATH}'; exit 1; }; fi; CURRENT_URL=\$(git remote get-url origin 2>/dev/null || echo ''); case \"\$CURRENT_URL\" in https://gitlab.com/*) echo 'Converting GitLab HTTPS origin to SSH...'; NEW_URL=\$(echo \"\$CURRENT_URL\" | sed 's|^https://gitlab.com/|git@gitlab.com:|'); git remote set-url origin \"\$NEW_URL\"; ;; https://github.com/*) echo 'Converting GitHub HTTPS origin to SSH...'; NEW_URL=\$(echo \"\$CURRENT_URL\" | sed 's|^https://github.com/|git@github.com:|'); git remote set-url origin \"\$NEW_URL\"; ;; esac; git fetch origin '${DEPLOY_BRANCH}'; (git checkout '${DEPLOY_BRANCH}' || git checkout -b '${DEPLOY_BRANCH}' 'origin/${DEPLOY_BRANCH}'); git pull --ff-only origin '${DEPLOY_BRANCH}'; git clean -fd; [ -f scripts/deploy.sh ] || { echo 'scripts/deploy.sh not found at ${DEPLOY_PATH}'; exit 1; }; [ -f docker-compose.prod.yml ] || { echo 'docker-compose.prod.yml not found at ${DEPLOY_PATH}'; exit 1; }; chmod +x scripts/deploy.sh"

      echo "Building prod stack from ${DEPLOY_PATH}..."
      printf '%s' "$ENV_FILE" | ssh -p "${VPS_PORT:-22}" "${DEPLOY_TARGET}" \
        "set -eu; ENV_TMP=\$(mktemp /tmp/${CI_PROJECT_NAME}_env.XXXXXX); trap 'rm -f \"\$ENV_TMP\"' EXIT; cat > \"\$ENV_TMP\"; chmod 600 \"\$ENV_TMP\"; cd '${DEPLOY_PATH}'; PROJECT_NAME='${DEPLOY_PROJECT_NAME}' COMPOSE_FILE='docker-compose.prod.yml' ENV_FILE_PATH=\"\$ENV_TMP\" ./scripts/deploy.sh all"
