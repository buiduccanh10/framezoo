map $http_x_forwarded_proto $proxy_proto_val {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 1. Main frontend & Unified Local Gateway (default server)
# Supports access via http://localhost or http://framezoo.local
server {
    listen 80 default_server;
    server_name localhost framezoo.local 127.0.0.1 "";

    client_max_body_size 512m;

    # Subtitle addon configure page -> proxy to framezoo-fe
    location ~ ^/addon/subtitles/configure/?$ {
        proxy_pass http://framezoo-fe:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto_val;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Stremio Addon & Subtitles API proxy to framezoo-be
    location /addon/ {
        proxy_pass http://framezoo-be:3000/addon/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto_val;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;

        # Stremio Addon CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Cache-Control, Accept-Language, Authorization, X-Requested-With" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # General Backend API proxy to framezoo-be
    location /api/ {
        proxy_pass http://framezoo-be:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto_val;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Public takedown blocklist proxy to framezoo-be
    location /compliance/ {
        proxy_pass http://framezoo-be:3000/compliance/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto_val;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Admin Portal proxy to framezoo-admin via path /admin/
    location /admin/ {
        proxy_pass http://framezoo-admin:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto_val;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Frontend web application (Landing, Addon Configure, Experience, etc.)
    location / {
        proxy_pass http://framezoo-fe:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto_val;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 2. Virtual Host: api.framezoo.local (mimics api.framezoo.top on prod)
server {
    listen 80;
    server_name api.framezoo.local api.localhost;

    client_max_body_size 512m;

    location ~ ^/addon/subtitles/configure/?$ {
        return 302 $scheme://framezoo.local$request_uri;
    }

    location / {
        proxy_pass http://framezoo-be:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto_val;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 3. Virtual Host: admin.framezoo.local (mimics admin.framezoo.top on prod)
server {
    listen 80;
    server_name admin.framezoo.local admin.localhost;

    client_max_body_size 512m;

    location / {
        proxy_pass http://framezoo-admin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto_val;
        proxy_set_header X-Forwarded-Host $host;
    }
}
