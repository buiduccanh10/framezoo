<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico?v=2" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' http://www.gstatic.com https://www.gstatic.com app://www.gstatic.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: http: https:; font-src 'self' data: http: https: https://fonts.gstatic.com; media-src 'self' blob: data: http: https:; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* http: https: ws: wss:; frame-src 'self' http: https:; worker-src 'self' blob:; manifest-src 'self';"
    />
    <meta
      name="description"
      content="Watch your favorite shows and movies for free with no ads ever!"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Open+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="/config.js"></script>

    {{#if env.VITE_TRACK_SCRIPT }} {{{ env.VITE_TRACK_SCRIPT }}} {{/if}}

    <meta name="darkreader-lock" />
    <meta name="referrer" content="always" />
    <title>Framezoo</title>

    {{#if opensearchEnabled }}
    <link
      rel="search"
      type="application/opensearchdescription+xml"
      title="Framezoo"
      href="/opensearch.xml"
    />
    {{/if}}
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
