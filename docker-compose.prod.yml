services:
  postgres:
    image: postgres:15-alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$PG_USER -d $$PG_DB"]
      interval: 5s
      retries: 10
      timeout: 2s
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DB}
    env_file:
      - ${ENV_FILE_PATH:-.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - framezoo-prod-network

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - framezoo-prod-network
    volumes:
      - redis-data:/data

  moonshine-service:
    build:
      context: .
      dockerfile: moonshine-service/Dockerfile
    restart: always
    volumes:
      - moonshine-cache:/root/.cache
    environment:
      MOONSHINE_LANGUAGE: ${MOONSHINE_LANGUAGE:-en}
      MOONSHINE_MODEL_ARCH: ${MOONSHINE_MODEL_ARCH:-tiny}
      MOONSHINE_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - framezoo-prod-network

  framezoo-be:
    build:
      context: .
      dockerfile: framezoo-be/Dockerfile
    restart: always
    env_file:
      - ${ENV_FILE_PATH:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      META_NAME: ${META_NAME}
      META_DESCRIPTION: ${META_DESCRIPTION}
      CRYPTO_SECRET: ${CRYPTO_SECRET}
      TMDB_API_KEY: ${TMDB_API_KEY}
      CAPTCHA: ${CAPTCHA}
      CAPTCHA_CLIENT_KEY: ${CAPTCHA_CLIENT_KEY}
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MOONSHINE_SERVICE_URL: http://moonshine-service:8000
      MOONSHINE_TIMEOUT_MS: ${MOONSHINE_TIMEOUT_MS:-120000}
      PROXY_REQUIRE_UPSTREAM_ALLOWLIST: "true"
      PROXY_ALLOWED_UPSTREAM_HOSTS: ${PROXY_ALLOWED_UPSTREAM_HOSTS:-}
      RATE_LIMIT_FAIL_CLOSED: "true"
      CORS_ALLOWED_ORIGINS: https://framezoo.top,app://renderer
      VIRTUAL_HOST: api.framezoo.top
      VIRTUAL_PORT: 3000
      VIRTUAL_PROTO: http
      VIRTUAL_PATH: /
      ACME_HOST: api.framezoo.top
      ACME_EMAIL: buiduccanh10@gmail.com
      NGINX_PROXY_READ_TIMEOUT: 360s
      NGINX_PROXY_CONNECT_TIMEOUT: 10s
      NGINX_PROXY_SEND_TIMEOUT: 360s
    volumes:
      - downloads-data:/data/downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      moonshine-service:
        condition: service_healthy
    networks:
      - framezoo-prod-network
      - betakiot_proxy_network

  framezoo-fe:
    build:
      context: .
      dockerfile: framezoo-fe/Dockerfile
      args:
        BACKEND_URL: ${VITE_BACKEND_URL}
        CORS_PROXY_URL: ${VITE_CORS_PROXY_URL}
        APP_DOMAIN: https://framezoo.top
        PWA_ENABLED: ${VITE_PWA_ENABLED:-true}
        OPENSEARCH_ENABLED: "true"
        TMDB_EMBED_API_URL: /tmdb-api
        TIDB_API_KEY: ${VITE_TIDB_API_KEY:-}
        WYZIE_API_KEY: ${VITE_WYZIE_API_KEY}
        SUBSOURCE_API_KEY: ${VITE_SUBSOURCE_API_KEY}
        USE_TRAKT: ${VITE_USE_TRAKT:-true}
        ENABLE_DEVTOOLS_PROTECTION: ${VITE_ENABLE_DEVTOOLS_PROTECTION:-false}
    hostname: framezoo-fe
    environment:
      - VIRTUAL_HOST=framezoo.top
      - VIRTUAL_PORT=80
      - VIRTUAL_PROTO=http
      - VIRTUAL_PATH=/
      - ACME_HOST=framezoo.top
      - ACME_EMAIL=buiduccanh10@gmail.com
      - NGINX_PROXY_READ_TIMEOUT=30s
      - NGINX_PROXY_CONNECT_TIMEOUT=10s
      - NGINX_PROXY_SEND_TIMEOUT=30s
    env_file:
      - ${ENV_FILE_PATH:-.env}
    depends_on:
      framezoo-be:
        condition: service_started
    networks:
      - framezoo-prod-network
      - betakiot_proxy_network
    restart: always

  desktop-publisher:
    profiles:
      - desktop-publisher
    image: node:22-alpine
    working_dir: /workspace
    command: ["/bin/sh", "/workspace/scripts/publish-desktop-bundle.sh"]
    restart: "no"
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./desktop-publish-staging:/staging
      - downloads-data:/data/downloads

networks:
  framezoo-prod-network:
    driver: bridge
  betakiot_proxy_network:
    external: true

volumes:
  postgres-data:
    external: ${EXTERNAL_LEGACY_VOLUMES:-false}
    name: framezoo_backend_postgres-data
  redis-data:
    external: ${EXTERNAL_LEGACY_VOLUMES:-false}
    name: framezoo_backend_redis-data
  downloads-data:
    external: ${EXTERNAL_LEGACY_VOLUMES:-false}
    name: framezoo_backend_downloads-data
  moonshine-cache:
    external: ${EXTERNAL_LEGACY_VOLUMES:-false}
    name: framezoo_backend_moonshine-cache
