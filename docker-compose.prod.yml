services:
  pstream-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TMDB_READ_API_KEY: ${VITE_TMDB_READ_API_KEY}
        BACKEND_URL: ${VITE_BACKEND_URL}
        CORS_PROXY_URL: ${VITE_CORS_PROXY_URL}
        APP_DOMAIN: https://alphaflix.io.vn
        PWA_ENABLED: "true"
        OPENSEARCH_ENABLED: "true"
    hostname: pstream-frontend
    expose:
      - '80'
    ports:
      - '4080:80'
    environment:
      - VIRTUAL_HOST=alphaflix.io.vn
      - VIRTUAL_PORT=80
      - VIRTUAL_PROTO=http
      - VIRTUAL_PATH=/
      - LETSENCRYPT_HOST=alphaflix.io.vn
      - LETSENCRYPT_EMAIL=buiduccanh10@gmail.com
      - NGINX_PROXY_READ_TIMEOUT=30s
      - NGINX_PROXY_CONNECT_TIMEOUT=10s
      - NGINX_PROXY_SEND_TIMEOUT=30s
    env_file:
      - .env
    networks:
      - pstream-prod-network
      - betakiot_proxy_network
    restart: always

  tmdb-embed-api:
    build:
      context: ../
      dockerfile: ./betamovie/Dockerfile.tmdb
    container_name: tmdb-embed-api
    environment:
      - TMDB_API_KEY=${VITE_TMDB_READ_API_KEY}
      - API_PORT=8787
      - BIND_HOST=0.0.0.0
    volumes:
      - tmdb-api-data:/app/utils/user-config.json
    networks:
      - pstream-prod-network
      - betakiot_proxy_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8787/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3


networks:
  pstream-prod-network:
    driver: bridge
  betakiot_proxy_network:
    external: true

volumes:
  tmdb-api-data:
