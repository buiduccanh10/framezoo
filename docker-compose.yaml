services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$PG_USER -d $$PG_DB"]
      interval: 5s
      retries: 10
      timeout: 2s
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DB}
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - betamovie-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - betamovie-network
    volumes:
      - redis-data:/data

  preview-service:
    build:
      context: ./betamovie-be/preview-service
    restart: unless-stopped
    environment:
      PORT: 3100
      PREVIEW_DATA_DIR: /data/previews
      PREVIEW_INTERVAL_SECONDS: ${PREVIEW_INTERVAL_SECONDS:-10}
      PREVIEW_FRAME_WIDTH: ${PREVIEW_FRAME_WIDTH:-320}
      PREVIEW_TILE_COLS: ${PREVIEW_TILE_COLS:-5}
      PREVIEW_TILE_ROWS: ${PREVIEW_TILE_ROWS:-5}
      PREVIEW_MAX_FRAMES: ${PREVIEW_MAX_FRAMES:-48}
      PREVIEW_FFMPEG_CONCURRENCY: ${PREVIEW_FFMPEG_CONCURRENCY:-4}
      PREVIEW_FFMPEG_MAX_CONCURRENCY: ${PREVIEW_FFMPEG_MAX_CONCURRENCY:-4}
      PREVIEW_FFMPEG_THREADS: ${PREVIEW_FFMPEG_THREADS:-1}
      PREVIEW_GENERATION_CONCURRENCY: ${PREVIEW_GENERATION_CONCURRENCY:-1}
      PREVIEW_COMMAND_TIMEOUT_MS: ${PREVIEW_COMMAND_TIMEOUT_MS:-90000}
    volumes:
      - preview-data:/data/previews
    networks:
      - betamovie-network

  subtitle-align-service:
    build:
      context: ./betamovie-be/subtitle-align-service
    restart: unless-stopped
    environment:
      PORT: 3200
      ALIGN_MODEL: ${SUBTITLE_ALIGN_MODEL:-small}
      ALIGN_MODEL_DIR: /models
      ALIGN_CPU_THREADS: ${SUBTITLE_ALIGN_CPU_THREADS:-4}
      ALIGN_FFMPEG_TIMEOUT_SECONDS: ${SUBTITLE_ALIGN_FFMPEG_TIMEOUT_SECONDS:-120}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      ALIGN_ASR_ONSET_DELAY_MS: ${ALIGN_ASR_ONSET_DELAY_MS:--300}
    volumes:
      - subtitle-align-models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3200/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - betamovie-network

  betamovie-be:
    build:
      context: .
      dockerfile: betamovie-be/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?database URL required}
      META_NAME: ${META_NAME}
      META_DESCRIPTION: ${META_DESCRIPTION}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?crypto secret required}
      TMDB_API_KEY: ${TMDB_API_KEY:?TMDB API key required}
      CAPTCHA: ${CAPTCHA}
      CAPTCHA_CLIENT_KEY: ${CAPTCHA_CLIENT_KEY}
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_URL: redis://redis:6379
      PROXY_REQUIRE_UPSTREAM_ALLOWLIST: ${PROXY_REQUIRE_UPSTREAM_ALLOWLIST:-false}
      RATE_LIMIT_FAIL_CLOSED: ${RATE_LIMIT_FAIL_CLOSED:-false}
      PREVIEW_SERVICE_TIMEOUT_MS: ${PREVIEW_SERVICE_TIMEOUT_MS:-300000}
      PREVIEW_SERVICE_URL: http://preview-service:3100
      PREVIEW_BACKEND_INTERNAL_BASE_URL: http://betamovie-be:3000
      SUBTITLE_ALIGN_ENABLED: ${SUBTITLE_ALIGN_ENABLED:-true}
      SUBTITLE_ALIGN_SERVICE_URL: http://subtitle-align-service:3200
      SUBTITLE_ALIGN_BACKEND_INTERNAL_BASE_URL: http://betamovie-be:3000
      SUBTITLE_ALIGN_SERVICE_TIMEOUT_MS: ${SUBTITLE_ALIGN_SERVICE_TIMEOUT_MS:-300000}
      SUBTITLE_ALIGN_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN:-}
      SUBTITLE_ALIGN_MODEL: ${SUBTITLE_ALIGN_MODEL:-small}
      SUBTITLE_ALIGN_RATE_LIMIT_WINDOW_MS: ${SUBTITLE_ALIGN_RATE_LIMIT_WINDOW_MS:-60000}
      SUBTITLE_ALIGN_RATE_LIMIT_MAX_REQUESTS: ${SUBTITLE_ALIGN_RATE_LIMIT_MAX_REQUESTS:-10}
    ports:
      - "3000:3000"
    volumes:
      - downloads-data:/data/downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      preview-service:
        condition: service_started
      subtitle-align-service:
        condition: service_started
    networks:
      - betamovie-network

  betamovie-fe:
    build:
      context: .
      dockerfile: betamovie-fe/Dockerfile
      args:
        BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3000}
        CORS_PROXY_URL: ${VITE_CORS_PROXY_URL}
        APP_DOMAIN: ${VITE_APP_DOMAIN:-http://localhost}
        PWA_ENABLED: ${VITE_PWA_ENABLED:-false}
        OPENSEARCH_ENABLED: ${VITE_OPENSEARCH_ENABLED:-false}
        TMDB_EMBED_API_URL: ${VITE_TMDB_EMBED_API_URL:-/tmdb-api}
        TIDB_API_KEY: ${VITE_TIDB_API_KEY:-}
        WYZIE_API_KEY: ${VITE_WYZIE_API_KEY}
        SUBSOURCE_API_KEY: ${VITE_SUBSOURCE_API_KEY}
        ENABLE_DEVTOOLS_PROTECTION: ${VITE_ENABLE_DEVTOOLS_PROTECTION:-false}
    ports:
      - "80:80"
    depends_on:
      betamovie-be:
        condition: service_started
    restart: unless-stopped
    networks:
      - betamovie-network

  desktop-publisher:
    profiles:
      - desktop-publisher
    image: node:22-alpine
    working_dir: /workspace
    command: ["/bin/sh", "/workspace/scripts/publish-desktop-bundle.sh"]
    restart: "no"
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./desktop-publish-staging:/staging
      - downloads-data:/data/downloads

networks:
  betamovie-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  preview-data:
  subtitle-align-models:
  downloads-data:
    name: betamovie_downloads-data
