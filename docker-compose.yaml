services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$PG_USER -d $$PG_DB"]
      interval: 5s
      retries: 10
      timeout: 2s
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DB}
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - framezoo-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - framezoo-network
    volumes:
      - redis-data:/data

  moonshine-service:
    build:
      context: .
      dockerfile: moonshine-service/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./moonshine-service:/app
      - moonshine-cache:/root/.cache
    environment:
      MOONSHINE_LANGUAGE: ${MOONSHINE_LANGUAGE:-en}
      MOONSHINE_MODEL_ARCH: ${MOONSHINE_MODEL_ARCH:-tiny}
      MOONSHINE_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN:-}
      MAX_CONCURRENT_INFERENCES: ${MAX_CONCURRENT_INFERENCES:-2}
      INFERENCE_TIMEOUT_SEC: ${INFERENCE_TIMEOUT_SEC:-60.0}
      CONCURRENCY_TIMEOUT_SEC: ${CONCURRENCY_TIMEOUT_SEC:-15.0}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-6}
      RATE_LIMIT_BURST_PERIOD: ${RATE_LIMIT_BURST_PERIOD:-10}
      RATE_LIMIT_SUSTAINED: ${RATE_LIMIT_SUSTAINED:-20}
      RATE_LIMIT_SUSTAINED_PERIOD: ${RATE_LIMIT_SUSTAINED_PERIOD:-60}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - framezoo-network

  framezoo-be:
    build:
      context: .
      dockerfile: framezoo-be/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?database URL required}
      META_NAME: ${META_NAME}
      META_DESCRIPTION: ${META_DESCRIPTION}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?crypto secret required}
      TMDB_API_KEY: ${TMDB_API_KEY:?TMDB API key required}
      CAPTCHA: ${CAPTCHA}
      CAPTCHA_CLIENT_KEY: ${CAPTCHA_CLIENT_KEY}
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_URL: redis://redis:6379
      MOONSHINE_SERVICE_URL: http://moonshine-service:8000
      MOONSHINE_TIMEOUT_MS: ${MOONSHINE_TIMEOUT_MS:-300000}
      PROXY_REQUIRE_UPSTREAM_ALLOWLIST: ${PROXY_REQUIRE_UPSTREAM_ALLOWLIST:-false}
      RATE_LIMIT_FAIL_CLOSED: ${RATE_LIMIT_FAIL_CLOSED:-false}
    ports:
      - "3000:3000"
    volumes:
      - downloads-data:/data/downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      moonshine-service:
        condition: service_healthy
    networks:
      - framezoo-network

  framezoo-fe:
    build:
      context: .
      dockerfile: framezoo-fe/Dockerfile
      args:
        BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3000}
        CORS_PROXY_URL: ${VITE_CORS_PROXY_URL}
        APP_DOMAIN: ${VITE_APP_DOMAIN:-http://localhost}
        PWA_ENABLED: ${VITE_PWA_ENABLED:-false}
        OPENSEARCH_ENABLED: ${VITE_OPENSEARCH_ENABLED:-false}
        TMDB_EMBED_API_URL: ${VITE_TMDB_EMBED_API_URL:-/tmdb-api}
        TIDB_API_KEY: ${VITE_TIDB_API_KEY:-}
        WYZIE_API_KEY: ${VITE_WYZIE_API_KEY}
        SUBSOURCE_API_KEY: ${VITE_SUBSOURCE_API_KEY}
        ENABLE_DEVTOOLS_PROTECTION: ${VITE_ENABLE_DEVTOOLS_PROTECTION:-false}
    ports:
      - "80:80"
    depends_on:
      framezoo-be:
        condition: service_started
    restart: unless-stopped
    networks:
      - framezoo-network

  desktop-publisher:
    profiles:
      - desktop-publisher
    image: node:22-alpine
    working_dir: /workspace
    command: ["/bin/sh", "/workspace/scripts/publish-desktop-bundle.sh"]
    restart: "no"
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./desktop-publish-staging:/staging
      - downloads-data:/data/downloads

networks:
  framezoo-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  downloads-data:
    name: framezoo_downloads-data
  moonshine-cache:
