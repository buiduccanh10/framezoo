services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$PG_USER -d $$PG_DB"]
      interval: 5s
      retries: 10
      timeout: 2s
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DB}
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - framezoo-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - framezoo-network
    volumes:
      - redis-data:/data

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    networks:
      - framezoo-network
    volumes:
      - redis-queue-data:/data

  clamav:
    image: clamav/clamav:1.4.6@sha256:6ba4e78b29853b2fc7e3c111389596e2cad5ec4ed5f0fd2cb663d29ab6b0e6a3
    platform: linux/amd64
    restart: unless-stopped
    expose:
      - "3310"
    environment:
      CLAMD_CONF_StreamMaxLength: 60M
      CLAMD_CONF_MaxScanSize: 60M
      CLAMD_CONF_MaxFileSize: 60M
      CLAMD_CONF_SelfCheck: 60
      CLAMD_CONF_ConcurrentDatabaseReload: "yes"
      FRESHCLAM_CHECKS: ${FEEDBACK_CLAMAV_CHECKS:-4}
    volumes:
      - clamav-db:/var/lib/clamav
    networks:
      - framezoo-network

  sync-service:
    build:
      context: .
      dockerfile: sync-service/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./sync-service:/app
    environment:
      SYNC_INTERNAL_TOKEN: ${INTERNAL_API_TOKEN:-}
      MAX_CONCURRENT_INFERENCES: ${MAX_CONCURRENT_INFERENCES:-4}
      INFERENCE_TIMEOUT_SEC: ${INFERENCE_TIMEOUT_SEC:-30.0}
      CONCURRENCY_TIMEOUT_SEC: ${CONCURRENCY_TIMEOUT_SEC:-10.0}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
      RATE_LIMIT_BURST_PERIOD: ${RATE_LIMIT_BURST_PERIOD:-10}
      RATE_LIMIT_SUSTAINED: ${RATE_LIMIT_SUSTAINED:-60}
      RATE_LIMIT_SUSTAINED_PERIOD: ${RATE_LIMIT_SUSTAINED_PERIOD:-60}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - framezoo-network

  framezoo-be:
    build:
      context: .
      dockerfile: framezoo-be/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?database URL required}
      META_NAME: ${META_NAME}
      META_DESCRIPTION: ${META_DESCRIPTION}
      CRYPTO_SECRET: ${CRYPTO_SECRET:?crypto secret required}
      TMDB_API_KEY: ${TMDB_API_KEY:?TMDB API key required}
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      CAPTCHA: ${CAPTCHA}
      CAPTCHA_CLIENT_KEY: ${CAPTCHA_CLIENT_KEY}
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_URL: redis://redis:6379
      REDIS_QUEUE_URL: redis://redis-queue:6379
      SYNC_SERVICE_URL: http://sync-service:8000
      SYNC_TIMEOUT_MS: ${SYNC_TIMEOUT_MS:-300000}
      PROXY_REQUIRE_UPSTREAM_ALLOWLIST: ${PROXY_REQUIRE_UPSTREAM_ALLOWLIST:-false}
      RATE_LIMIT_FAIL_CLOSED: ${RATE_LIMIT_FAIL_CLOSED:-false}
      FEEDBACK_CLAMAV_HOST: clamav
      FEEDBACK_CLAMAV_REQUIRED: ${FEEDBACK_CLAMAV_REQUIRED:-true}
    ports:
      - "3000:3000"
    volumes:
      - feedback-storage:/data/feedback
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redis-queue:
        condition: service_started
      clamav:
        condition: service_started
      sync-service:
        condition: service_healthy
    networks:
      - framezoo-network

  framezoo-mail-worker:
    build:
      context: .
      dockerfile: framezoo-be/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?database URL required}
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_QUEUE_URL: redis://redis-queue:6379
      EMAIL_WORKER_CONCURRENCY: ${EMAIL_WORKER_CONCURRENCY:-5}
    command: ["sh", "-c", "pnpm --filter framezoo-be exec prisma migrate deploy && pnpm --filter framezoo-be worker:email"]
    depends_on:
      postgres:
        condition: service_healthy
      redis-queue:
        condition: service_started
    networks:
      - framezoo-network

  framezoo-fe:
    build:
      context: .
      dockerfile: framezoo-fe/Dockerfile
      args:
        BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3000}
        CORS_PROXY_URL: ${VITE_CORS_PROXY_URL}
        APP_DOMAIN: ${VITE_APP_DOMAIN:-http://localhost}
        PWA_ENABLED: ${VITE_PWA_ENABLED:-false}
        OPENSEARCH_ENABLED: ${VITE_OPENSEARCH_ENABLED:-false}
        TMDB_EMBED_API_URL: ${VITE_TMDB_EMBED_API_URL:-/tmdb-api}
        TIDB_API_KEY: ${VITE_TIDB_API_KEY:-}
        ENABLE_DEVTOOLS_PROTECTION: ${VITE_ENABLE_DEVTOOLS_PROTECTION:-false}
        VITE_LEGAL_OPERATOR_NAME: ${VITE_LEGAL_OPERATOR_NAME:-}
        VITE_LEGAL_OPERATOR_ADDRESS: ${VITE_LEGAL_OPERATOR_ADDRESS:-}
        VITE_LEGAL_EMAIL: ${VITE_LEGAL_EMAIL:-}
        VITE_LEGAL_PHONE: ${VITE_LEGAL_PHONE:-}
    ports:
      - "${FE_PORT:-5173}:80"
    expose:
      - "80"
    depends_on:
      framezoo-be:
        condition: service_started
    restart: unless-stopped
    networks:
      - framezoo-network

  framezoo-admin:
    build:
      context: .
      dockerfile: framezoo-admin/Dockerfile
    ports:
      - "5175:80"
    depends_on:
      framezoo-be:
        condition: service_started
    restart: unless-stopped
    networks:
      - framezoo-network

  nginx:
    image: nginx:stable-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./ops/local-nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - framezoo-fe
      - framezoo-be
      - framezoo-admin
    networks:
      - framezoo-network

networks:
  framezoo-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  feedback-storage:
  clamav-db:
  redis-queue-data:
