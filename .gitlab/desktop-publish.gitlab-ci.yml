workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline" && $CI_COMMIT_BRANCH == "main"'
    - when: never

stages:
  - prepare
  - build
  - publish

variables:
  GIT_STRATEGY: none
  PNPM_VERSION: "11.9.0"

.default_ssh_setup: &default_ssh_setup
  before_script:
    - which apk && apk add --no-cache openssh-client git curl tar || (apt-get update && apt-get install -y openssh-client git curl tar && rm -rf /var/lib/apt/lists/*)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval "$(ssh-agent -s)"
    - echo "$VPS_SSH_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts

prepare:desktop:
  stage: prepare
  image: node:22-alpine
  variables:
    GIT_STRATEGY: fetch
  script:
    - |
      set -eu

      CHECKOUT_REF="${PARENT_COMMIT_SHA:-$CI_COMMIT_SHA}"
      PUBLISHED_AT="${DESKTOP_PUBLISHED_AT:-${PARENT_PIPELINE_CREATED_AT:-${CI_PIPELINE_CREATED_AT:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}}}"

      {
        printf 'DESKTOP_CHECKOUT_REF=%s\n' "$CHECKOUT_REF"
        printf 'DESKTOP_PUBLISHED_AT=%s\n' "$PUBLISHED_AT"
        printf 'DESKTOP_SHOULD_PUBLISH=true\n'
      } > desktop-publish.env

      echo "Desktop publish prepared for ${CHECKOUT_REF}"
  artifacts:
    reports:
      dotenv: desktop-publish.env
    paths:
      - desktop-publish.env
    expire_in: 1 day

build:desktop:macos:
  stage: build
  image: electronuserland/builder:22-wine
  needs:
    - job: prepare:desktop
      artifacts: true
  variables:
    GIT_STRATEGY: fetch
  script:
    - |
      set -eu

      if [ -z "${ENV_FILE:-}" ]; then
        echo "ENV_FILE is empty. Please set ENV_FILE in GitLab CI/CD variables."
        exit 1
      fi

      corepack enable
      corepack prepare pnpm@${PNPM_VERSION} --activate

      printf '%s' "$ENV_FILE" > .env
      printf '%s' "$ENV_FILE" > framezoo-fe/.env

      BACKEND_URL="$(grep -E '^VITE_BACKEND_URL=' .env | head -n 1 | cut -d= -f2- | tr -d '"' | tr -d "'" || true)"
      if [ -n "$BACKEND_URL" ]; then
        export VITE_BACKEND_URL="$BACKEND_URL"
      fi

      DEVTOOLS="$(grep -E '^VITE_ENABLE_DEVTOOLS_PROTECTION=' .env | head -n 1 | cut -d= -f2- | tr -d '"' | tr -d "'" || true)"
      if [ -n "$DEVTOOLS" ]; then
        export VITE_ENABLE_DEVTOOLS_PROTECTION="$DEVTOOLS"
      fi

      pnpm install --frozen-lockfile

      ARTIFACT_ROOT="desktop-artifacts"
      RELEASE_DIR="framezoo-desktop/release"

      clean_release_dir() {
        rm -rf "$RELEASE_DIR"
        mkdir -p "$RELEASE_DIR"
      }

      require_files() {
        variant="$1"
        shift
        target="$ARTIFACT_ROOT/$variant"
        mkdir -p "$target"

        for pattern in "$@"; do
          found=false
          for file in $RELEASE_DIR/$pattern; do
            if [ ! -e "$file" ]; then
              continue
            fi

            cp "$file" "$target/"
            found=true
          done

          if [ "$found" = false ]; then
            echo "Missing required desktop artifact for ${variant}: ${pattern}"
            exit 1
          fi
        done
      }

      copy_optional() {
        variant="$1"
        pattern="$2"
        target="$ARTIFACT_ROOT/$variant"
        mkdir -p "$target"

        for file in $RELEASE_DIR/$pattern; do
          if [ -e "$file" ]; then
            cp "$file" "$target/"
          fi
        done
      }

      rm -rf "$ARTIFACT_ROOT"

      pnpm --filter Framezoo build

      clean_release_dir
      pnpm --filter Framezoo run resources:ensure:darwin-arm64
      pnpm --filter Framezoo run torrent:build:darwin-arm64
      pnpm --filter Framezoo run native:build:darwin-arm64
      pnpm --filter Framezoo exec electron-builder --mac zip --arm64
      require_files "mac-arm64" "latest-mac.yml" "Framezoo-*-arm64-mac.zip" "Framezoo-*-arm64-mac.zip.blockmap"
      copy_optional "mac-arm64" "Framezoo-*-arm64-mac.dmg"

      clean_release_dir
      pnpm --filter Framezoo run resources:ensure:darwin-x64
      pnpm --filter Framezoo run torrent:build:darwin-x64
      pnpm --filter Framezoo run native:build:darwin-x64
      pnpm --filter Framezoo exec electron-builder --mac zip --x64
      require_files "mac-x64" "latest-mac.yml" "Framezoo-*-x64-mac.zip" "Framezoo-*-x64-mac.zip.blockmap"
      copy_optional "mac-x64" "Framezoo-*-x64-mac.dmg"

      find "$ARTIFACT_ROOT" -maxdepth 2 -type f | sort
  artifacts:
    paths:
      - desktop-artifacts/mac-arm64/
      - desktop-artifacts/mac-x64/
    expire_in: 1 day

# ──────────────────────────────────────────────────────────────────────────────
# Native Windows runners
#
# Prerequisites – register two GitLab shell runners on Windows machines:
#   win-x64 runner : gitlab-runner register ... --tag-list windows,x64
#   win-arm64 runner: gitlab-runner register ... --tag-list windows,arm64
#
# Each runner needs:
#   - Node.js 22 (corepack enabled)
#   - Python 3.11+ on PATH
#   - pnpm (installed via corepack)
#   - Visual Studio Build Tools 2022 (MSVC, CMake on PATH)
#   - 7-Zip (7z) on PATH - used to extract the libmpv dev SDK
# ──────────────────────────────────────────────────────────────────────────────

build:desktop:windows:x64:
  stage: build
  tags:
    - windows
    - x64
  needs:
    - job: prepare:desktop
      artifacts: true
  variables:
    GIT_STRATEGY: fetch
  script:
    - |
      $ErrorActionPreference = 'Stop'

      if (-not $env:ENV_FILE) {
        Write-Error "ENV_FILE is empty. Please set ENV_FILE in GitLab CI/CD variables."
        exit 1
      }

      corepack enable
      corepack prepare pnpm@$env:PNPM_VERSION --activate

      $env:ENV_FILE | Out-File -FilePath .env -Encoding utf8 -NoNewline
      $env:ENV_FILE | Out-File -FilePath framezoo-fe/.env -Encoding utf8 -NoNewline

      $backendUrl = (Get-Content .env | Select-String '^VITE_BACKEND_URL=' | Select-Object -First 1) -replace '^VITE_BACKEND_URL=',''
      if ($backendUrl) { $env:VITE_BACKEND_URL = $backendUrl.Trim('"').Trim("'") }

      $devtools = (Get-Content .env | Select-String '^VITE_ENABLE_DEVTOOLS_PROTECTION=' | Select-Object -First 1) -replace '^VITE_ENABLE_DEVTOOLS_PROTECTION=',''
      if ($devtools) { $env:VITE_ENABLE_DEVTOOLS_PROTECTION = $devtools.Trim('"').Trim("'") }

      pnpm install --frozen-lockfile

      # Install Node headers + import library for the native addon build
      $nodeVersion = node -p "process.versions.node"
      $nodeGypDir = Join-Path $env:TEMP "node-gyp"
      pnpm exec node-gyp install --target $nodeVersion --arch=x64 --devdir $nodeGypDir

      $includeDir = Join-Path $nodeGypDir "$nodeVersion\include\node"
      if (-not (Test-Path (Join-Path $includeDir "node_api.h"))) {
        Write-Error "Node headers not found: $includeDir"
        exit 1
      }
      $nodeLib = Join-Path $nodeGypDir "$nodeVersion\x64\node.lib"
      if (-not (Test-Path $nodeLib)) {
        $nodeLib = Join-Path $nodeGypDir "$nodeVersion\win32-x64\node.lib"
      }
      if (-not (Test-Path $nodeLib)) {
        $nodeLib = Join-Path $env:CI_PROJECT_DIR "framezoo-desktop\node_modules\electron\dist\node.lib"
      }
      if (-not (Test-Path $nodeLib)) {
        Write-Error "node.lib not found. Checked node-gyp cache and electron dist."
        exit 1
      }
      $env:NODE_INCLUDE_DIR = $includeDir
      $env:NODE_LIB = $nodeLib
      Write-Host "NODE_INCLUDE_DIR=$includeDir"
      Write-Host "NODE_LIB=$nodeLib"

      # Fetch libmpv dev SDK (downloads once; reuses the cached SDK on re-runs)
      $sdkOut = Join-Path $env:CI_PROJECT_DIR "resources\libmpv-sdk\win32-x64"
      pnpm --filter Framezoo run libmpv:fetch:win32-x64 -- --out $sdkOut
      $sdkCandidates = @($sdkOut) + @(Get-ChildItem -Path $sdkOut -Directory -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName)
      $libmpvRoot = $sdkCandidates | Where-Object { Test-Path (Join-Path $_ "include\mpv\client.h") } | Select-Object -First 1
      if (-not $libmpvRoot) { $libmpvRoot = $sdkOut }
      $env:LIBMPV_ROOT = $libmpvRoot
      Write-Host "LIBMPV_ROOT=$libmpvRoot"

      # Build torrent sidecar binary (native win32-x64)
      pnpm --filter Framezoo run torrent:setup
      pnpm --filter Framezoo run torrent:build:win32-x64

      # Build native libmpv addon
      pnpm --filter Framezoo run native:build:win32-x64
      pnpm --filter Framezoo run resources:ensure:win32-x64

      # Fail fast if the addon cannot be loaded inside real Electron. The
      # --filter exec runs inside the framezoo-desktop package dir, so the
      # addon/runtime paths below are package-relative. Kept on one line to
      # avoid PowerShell backtick continuation issues in YAML block scalars.
      pnpm --filter Framezoo exec electron scripts/verify-libmpv-native.mjs --addon resources/native/win32-x64/libmpv.node --runtime-dir resources/libmpv/win32-x64

      # Build renderer + main process
      pnpm --filter Framezoo build

      # Package NSIS installer
      Remove-Item -Recurse -Force framezoo-desktop/release -ErrorAction SilentlyContinue
      New-Item -ItemType Directory -Force framezoo-desktop/release | Out-Null
      pnpm --filter Framezoo exec electron-builder --win nsis --x64

      # Collect artifacts
      $artifactDir = "desktop-artifacts/win-x64"
      New-Item -ItemType Directory -Force $artifactDir | Out-Null
      $releaseDir = "framezoo-desktop/release"

      $required = @("latest.yml", "Framezoo-*-x64.exe", "Framezoo-*-x64.exe.blockmap")
      foreach ($pattern in $required) {
        $files = Get-ChildItem "$releaseDir/$pattern" -ErrorAction SilentlyContinue
        if (-not $files) {
          Write-Error "Missing required artifact: $pattern"
          exit 1
        }
        $files | Copy-Item -Destination $artifactDir
      }

      Get-ChildItem $artifactDir | Select-Object -ExpandProperty Name
  artifacts:
    paths:
      - desktop-artifacts/win-x64/
    expire_in: 1 day

