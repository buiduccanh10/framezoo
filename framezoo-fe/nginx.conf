map $http_x_forwarded_proto $proxy_proto_val {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    location = /config.js {
        add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* ^/(favicon(-[0-9]+)?\.png|favicon\.ico|apple-touch-icon\.png)$ {
        add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate" always;
        try_files $uri =404;
    }

    rewrite ^/(experience|ecosystem|create-addon|download|guide/install|legal/(?:terms|privacy|copyright|addon-policy|dmca|disclaimer|about))/$ /$1 permanent;

    location ~ ^/(experience|ecosystem|create-addon|download|guide/install|legal/(terms|privacy|copyright|addon-policy))$ {
        add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate" always;
        try_files $uri/index.html =404;
    }

    location ~ ^/legal/(dmca|disclaimer)$ {
        add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate" always;
        try_files /legal/copyright/index.html /index.html =404;
    }

    location = /legal/about {
        add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate" always;
        try_files /legal/terms/index.html /index.html =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
        try_files $uri =404;
    }

    # Serve the frontend configuration page for Stremio / Desktop subtitle addon configure
    location ~ ^/addon/subtitles/configure/?$ {
        add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate" always;
        try_files /addon/subtitles/configure/index.html /index.html =404;
    }

    location /addon/ {
        proxy_pass http://framezoo-be:3000/addon/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto_val;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;

        # Stremio Addon CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Cache-Control, Accept-Language, Authorization, X-Requested-With" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location /api/ {
        proxy_pass http://framezoo-be:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto_val;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 512m;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
