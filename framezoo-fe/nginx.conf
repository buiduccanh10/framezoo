map $http_x_forwarded_proto $proxy_proto_val {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost;
    # Re-resolve Docker service names so backend recreates don't leave stale IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;
    root /usr/share/nginx/html;
    index index.html index.htm;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml application/xml;

    location = / {
        add_header Cache-Control "no-cache, max-age=0, s-maxage=0, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        try_files /index.html =404;
    }

    location = /config.js {
        add_header Cache-Control "no-cache, no-store, max-age=0, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~* ^/(robots\.txt|sitemap\.xml|og-preview\.jpg|framezoo-logo\.svg|framezoo-app-icon\.png|favicon(-[0-9]+)?\.png|favicon\.ico|apple-touch-icon\.png|showcase-.*\.(mp4|jpg))$ {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header CDN-Cache-Control "max-age=60" always;
        add_header Cloudflare-CDN-Cache-Control "max-age=60" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, s-maxage=0, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        try_files $uri =404;
    }

    rewrite ^/(experience|ecosystem|create-addon|download|guide/install|legal/(?:terms|privacy|copyright|addon-policy))/$ /$1 permanent;
    rewrite ^/(?:install-guide|docs/install|guide/install/.+)/?$ /guide/install permanent;
    rewrite ^/(?:legal|legal/about|terms|about)/?$ /legal/terms permanent;
    rewrite ^/privacy/?$ /legal/privacy permanent;
    rewrite ^/(?:legal/(?:dmca|disclaimer)|copyright|dmca|disclaimer)/?$ /legal/copyright permanent;
    rewrite ^/addon-policy/?$ /legal/addon-policy permanent;

    location ~ ^/(experience|ecosystem|create-addon|download|guide/install|legal/(terms|privacy|copyright|addon-policy))$ {
        add_header Cache-Control "no-cache, max-age=0, s-maxage=0, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        try_files $uri/index.html =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
        try_files $uri =404;
    }

    # Serve the frontend configuration page for Stremio / Desktop subtitle addon configure
    location ~ ^/addon/subtitles/configure/?$ {
        add_header Cache-Control "no-cache, max-age=0, s-maxage=0, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /addon/subtitles/configure/index.html /index.html =404;
    }

    location ~ ^/(media/|browse/|discover) {
        add_header Cache-Control "no-cache, max-age=0, s-maxage=0, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    location /addon/ {
        set $framezoo_be http://framezoo-be:3000;
        proxy_pass $framezoo_be;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto_val;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;

        # Stremio Addon CORS headers
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Cache-Control, Accept-Language, Authorization, X-Requested-With" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    location /api/ {
        set $framezoo_be http://framezoo-be:3000;
        proxy_pass $framezoo_be;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto_val;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 512m;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
