server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    location = /config.js {
        add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* ^/(favicon(-[0-9]+)?\.png|favicon\.ico|apple-touch-icon\.png)$ {
        add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "public, max-age=0, s-maxage=0, must-revalidate" always;
        try_files $uri =404;
    }

    location = /experience {
        try_files /experience/index.html =404;
    }

    location = /ecosystem {
        try_files /ecosystem/index.html =404;
    }

    location = /create-addon {
        try_files /create-addon/index.html =404;
    }

    location = /download {
        try_files /download/index.html =404;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
