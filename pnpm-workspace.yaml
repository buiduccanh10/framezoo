minimumReleaseAgeExclude:
  - '@hono/node-server@2.1.0'

audit:
  ignore:
    - GHSA-qwww-vcr4-c8h2
    # image-size has no patched npm release; local patch guards ICNS/JXL/HEIF parser loops.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

patchedDependencies:
  image-size@1.2.1: patches/image-size@1.2.1.patch

auditConfig:
  ignoreGhsas:
    - GHSA-qwww-vcr4-c8h2
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
