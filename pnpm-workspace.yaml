packages:
  - framezoo-fe
  - framezoo-be
  - framezoo-desktop
  - framezoo-mobile

shamefullyHoist: true
strictPeerDependencies: false

allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  electron-winstaller: true
  esbuild: true
  ffmpeg-static: true
  ffprobe-static: true
  prisma: true
  unrs-resolver: true

